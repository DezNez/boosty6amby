<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6amby boosty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Идеально растягивает webm на весь экран */
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- 
      autoplay: запускает само
      loop: крутит бесконечно
      muted: без звука (ОБЯЗАТЕЛЬНО, иначе браузер заблокирует автозапуск видео)
      playsinline: чтобы на смартфонах не открывалось в стандартном плеере
    -->
    <video autoplay loop muted playsinline>
        <source src="sticker.webm" type="video/webm">
        Ваш браузер не поддерживает видео.
    </video>

</body>
</html>
